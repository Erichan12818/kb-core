# Example evaluation set.
#
# These queries describe a fictional knowledge base so the file can ship as a
# template. Running it unchanged against your own vault will score near zero,
# which is expected: the categories and keywords below are not in your data.
#
# To measure your own retrieval quality, replace every entry with questions you
# actually ask, the category you would expect the answer to live in, and words
# that must appear in a correct excerpt. Ten queries is enough to see movement.
#
#   python -m kb.eval --queries path/to/your_queries.yaml
#
# Field notes:
#   query               what a user would type
#   expected_category   the category folder the answer should come from
#   expected_keywords   any one of these appearing in the top hits counts
#   notes               free text, for your own reference
queries:
  - id: q01
    query: "how is the vector collection configured for hybrid search"
    expected_category: infrastructure
    expected_keywords: ["dense", "sparse", "collection"]
    notes: "core retrieval setup"
  - id: q02
    query: "how do I connect an agent session to the knowledge base"
    expected_category: infrastructure
    expected_keywords: ["MCP", "recall", "session"]
    notes: "agent integration path"
  - id: q03
    query: "how does a note get added from chat"
    expected_category: automation
    expected_keywords: ["add", "ingest", "category"]
    notes: "capture flow"
  - id: q04
    query: "how are requests routed to a local model instead of the cloud"
    expected_category: automation
    expected_keywords: ["ollama", "provider", "role"]
    notes: "LLM routing"
  - id: q05
    query: "why did the scheduled job not fire last night"
    expected_category: operations
    expected_keywords: ["schedule", "worker", "log"]
    notes: "operational troubleshooting"
  - id: q06
    query: "what has to happen before an access token expires"
    expected_category: operations
    expected_keywords: ["token", "expiry", "renew"]
    notes: "credential maintenance"
  - id: q07
    query: "what rules govern how categories are split or merged"
    expected_category: reference
    expected_keywords: ["taxonomy", "category", "policy"]
    notes: "taxonomy governance"
  - id: q08
    query: "how does the message layer hand work between components"
    expected_category: architecture
    expected_keywords: ["queue", "broker", "message"]
    notes: "inter-component messaging"
  - id: q09
    query: "how does a worker claim and complete a task"
    expected_category: architecture
    expected_keywords: ["task", "worker", "claim"]
    notes: "task orchestration"
  - id: q10
    query: "how do unsorted captures get triaged into categories"
    expected_category: inbox
    expected_keywords: ["inbox", "triage", "category"]
    notes: "inbox handling"
