[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-core"
dynamic = ["version"]
description = "Private, local-first knowledge base with hybrid retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "qdrant-client",
    "fastembed",
    "langchain-text-splitters",
    "langchain-community",
    "pyyaml",
    "requests",
    "pillow",
    "pypdf",
    "python-docx",
    "openpyxl",
    "python-pptx",
    "rapidocr-onnxruntime",
    "pymupdf",
]

[project.scripts]
kb-core = "kb.desktop:main"
kb = "kb.cli:main"

[tool.setuptools.dynamic]
version = { attr = "kb.__version__" }

[tool.setuptools.packages.find]
include = ["kb", "kb.*"]

[tool.setuptools.package-data]
kb = ["static/ui.html", "eval_queries.yaml"]
