name: Smoke

# Exercises the QUICKSTART path end to end against a real Qdrant, because unit
# tests cannot catch the failure that matters most for a self-hosted product:
# the one where a fresh clone does not work on someone else's machine.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests/ -v

  end-to-end:
    name: Compose end-to-end
    runs-on: ubuntu-latest
    # The first run downloads the ~2.3GB embedding model, so this is slow by
    # nature. The cache below makes reruns quick.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/kb-hf
          key: hf-cache-${{ hashFiles('requirements.txt') }}
          restore-keys: hf-cache-

      - name: Run smoke test
        env:
          KEEP_STACK: "0"
          INGEST_TIMEOUT: "1800"
        run: bash bin/smoke.sh

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color || true
